openapi: 3.0.3
info:
  title: Fosterforeldre Omsorgsansvar Innsending API
  version: v1
  description: >-
    Brukervennlig JSON API for innsending av meldinger om endring av
    omsorgsansvar, med asynkron tilbakemelding via polling. Payloaden er
    domenetilpasset og skjuler intern XML/XSD-struktur.


    Foresporselstyper:

    - Endre: Registrere ny oppforing med informasjon og tilhorende metadata i
    Folkeregisteret. Dersom verdi finnes fra for, blir denne meldingen avvist.

    - Opphoere: Avslutte gyldighetsperioden for en oppforing i Folkeregisteret
    ved a sette opphorstidspunktet i de tilhorende metadataene.

    - Korrigere: Bytte ut informasjon eller metadata pa en eksisterende
    oppforing i Folkeregisteret. Hele oppforingen far nytt ajourholdstidspunkt
    tilsvarende tidspunktet for korrigeringen.

    - Annullere: Fjerne en oppforing med informasjon og tilhorende metadata slik
    at det ikke lenger vises i Folkeregisteret at informasjonen har vaert
    registrert. Informasjonen har aldri vaert gyldig.

    - Overfoere: Ansvaret for et fosterbarn overfores fra en barnevernstjeneste
    til en annen.
servers:
  - url: https://api.test.fiks.ks.no
    description: Test
  - url: https://api.fiks.ks.no
    description: Produksjon
security:
  - bearerAuth: []
tags:
  - name: Innsending
    description: Endepunkter for innsending av meldinger om omsorgsansvar
  - name: Tilbakemelding
    description: Endepunkter for polling og oppslag av tilbakemeldinger
paths:
  /api/v1/omsorgsansvar/endre:
    post:
      tags:
        - Innsending
      summary: Send melding om endring
      description: >-
        Registrere ny oppforing med informasjon og tilhorende metadata i
        Folkeregisteret. Dersom verdi finnes fra for, blir denne meldingen
        avvist. `forespoerseltype` eksponeres ikke i request-payloaden, siden
        operasjonen bestemmes av URL-en.
      operationId: sendInnEndring
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndreRequest'
      responses:
        '202':
          description: Melding mottatt for asynkron behandling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InnsendingKvittering'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/omsorgsansvar/korrigere:
    post:
      tags:
        - Innsending
      summary: Send melding om korrigering
      description: >-
        Bytte ut informasjon eller metadata pa en eksisterende oppforing i
        Folkeregisteret. Hele oppforingen far nytt ajourholdstidspunkt
        tilsvarende tidspunktet for korrigeringen. `forespoerseltype`
        eksponeres ikke i request-payloaden, siden operasjonen bestemmes av
        URL-en.
      operationId: sendInnKorrigering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KorrigereRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/omsorgsansvar/opphoere:
    post:
      tags:
        - Innsending
      summary: Send melding om opphor
      description: >-
        Avslutte gyldighetsperioden for en oppforing i Folkeregisteret ved a
        sette opphorstidspunktet i de tilhorende metadataene.
        `forespoerseltype` eksponeres ikke i request-payloaden, siden
        operasjonen bestemmes av URL-en.
      operationId: sendInnOpphoer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpphoereRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/omsorgsansvar/annullere:
    post:
      tags:
        - Innsending
      summary: Send melding om annullering
      description: >-
        Fjerne en oppforing med informasjon og tilhorende metadata slik at det
        ikke lenger vises i Folkeregisteret at informasjonen har vaert
        registrert. Informasjonen har aldri vaert gyldig.
        `forespoerseltype` eksponeres ikke i request-payloaden, siden
        operasjonen bestemmes av URL-en.
      operationId: sendInnAnnullering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnullereRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/omsorgsansvar/overfoere:
    post:
      tags:
        - Innsending
      summary: Send melding om overforing
      description: >-
        Ansvaret for et fosterbarn overfores fra en barnevernstjeneste til en
        annen. `forespoerseltype` eksponeres ikke i request-payloaden, siden
        operasjonen bestemmes av URL-en.
      operationId: sendInnOverfoering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverfoereRequest'
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/tilbakemeldinger/start:
    get:
      tags:
        - Tilbakemelding
      summary: Hent startsekvens for klient
      description: >-
        Returnerer startsekvens for autentisert klient. Sekvensen er
        klient-skopet, ikke global. Sekvensnummer gjenbrukes fra Skatt og kan
        derfor inneholde hull; klienten ma ikke anta at verdiene er
        fortlopende.

        Bruk denne ved oppstart:
        1) Kall dette endepunktet.
        2) Les `sekvensnummer` i responsen.
        3) Kall `GET /api/v1/tilbakemeldinger` med `fraSekvensnummer=<sekvensnummer>`.

        Ved videre polling bruker klienten `nesteSekvensnummer` fra forrige poll-respons,
        ikke `/start` pa nytt.
      operationId: hentStartsekvensForTilbakemeldinger
      parameters:
        - name: dato
          in: query
          required: false
          description: >-
            Valgfri dato for startpunkt. Nar satt returneres sekvens som peker pa
            klientens hendelser fra oppgitt dato.
          schema:
            type: string
            format: date
            example: '2026-09-01'
      responses:
        '200':
          description: Startsekvens for klient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TilbakemeldingStart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tilbakemeldinger:
    get:
      tags:
        - Tilbakemelding
      summary: Poll tilbakemeldinger
      description: >-
        Henter tilbakemeldinger for autentisert klient fra og med gitt sekvens.
        Returnerer kun klientens egne meldinger. Sekvensnummer gjenbrukes fra
        Skatt og kan inneholde hull, sa klienten ma alltid bruke returnert
        `nesteSekvensnummer` og ikke beregne neste verdi selv.

        Polling-flyt:
        1) Start med sekvens fra `GET /api/v1/tilbakemeldinger/start`.
        2) Send `fraSekvensnummer` i dette kallet.
        3) Bruk `nesteSekvensnummer` fra responsen i neste kall.
        4) Gjenta med jevnt intervall.
      operationId: hentTilbakemeldinger
      parameters:
        - name: fraSekvensnummer
          in: query
          required: false
          description: >-
            Sekvensnummer a starte fra (inkludert). Bruk `sekvensnummer` fra
            `/tilbakemeldinger/start` ved oppstart, og senere `nesteSekvensnummer`
            fra forrige poll-respons. Sekvensnummer kan inneholde hull fordi
            sekvensen gjenbrukes fra Skatt.
          schema:
            type: integer
            format: int64
            default: 0
            minimum: 0
        - name: antall
          in: query
          required: false
          description: Maks antall hendelser som returneres.
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 1000
      responses:
        '200':
          description: Liste med tilbakemeldinger for klient.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TilbakemeldingSide'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/tilbakemeldinger/meldinger/{avsendersMeldingsidentifikator}:
    get:
      tags:
        - Tilbakemelding
      summary: Hent tilbakemelding per klientmeldingsid
      description: >-
        Oppslag pa klientens egen meldingsid. Nyttig ved ny innsending/idempotens og
        gjenfinning.
      operationId: hentTilbakemeldingVedAvsendersMeldingsidentifikator
      parameters:
        - name: avsendersMeldingsidentifikator
          in: path
          required: true
          schema:
            type: string
            maxLength: 4000
      responses:
        '200':
          description: Tilbakemelding funnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TilbakemeldingHendelse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/tilbakemeldinger/saker/{saksnummer}:
    get:
      tags:
        - Tilbakemelding
      summary: Hent status for sak
      description: Returnerer siste kjente status for en innsending.
      operationId: hentTilbakemeldingVedSaksnummer
      parameters:
        - name: saksnummer
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Sak funnet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SakStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Accepted:
      description: Melding mottatt for asynkron behandling.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InnsendingKvittering'
    BadRequest:
      description: Ugyldig input.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Feilmelding'
          examples:
            ugyldigInput:
              summary: Ugyldig payload eller valideringsfeil
              value:
                kode: valideringsfeil
                backendFeilkode: ske.folkeregister.mottak.infrastructure.exceptions.ValideringsFeil
                melding: Feltet 'barn.foedselsEllerDNummer' ma matche ^[0-9]{11}$
                httpStatus: 400
                alvorlighetsgrad: WARNING
                tilleggsinformasjon:
                  felt: barn.foedselsEllerDNummer
                  regel: ^[0-9]{11}$
                korrelasjonsid: 56a8ad5a81ec4cf4aa4f790507cd66a0
    Unauthorized:
      description: Mangler gyldig autentisering.
    Forbidden:
      description: Ikke tilgang.
    Conflict:
      description: Konflikt, typisk duplikat `avsendersMeldingsidentifikator`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IdempotensKonflikt'
          examples:
            duplikatMeldingsid:
              summary: Samme avsendersMeldingsidentifikator er allerede brukt
              value:
                kode: idempotent_konflikt
                melding: avsendersMeldingsidentifikator finnes allerede for denne klienten.
                avsendersMeldingsidentifikator: MSG-2026-ENDRE-0001
                sakId: 2d7f86de-4d3c-4e93-a9fc-3f65a54f5c4a
                saksnummer: '2026-000123'
                korrelasjonsid: 0f7dd0f8fefe4f839146d0fbac9af510
    NotFound:
      description: Ressurs ikke funnet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Feilmelding'
  schemas:
    EndreRequest:
      allOf:
        - $ref: '#/components/schemas/OmsorgsansvarEndringRequest'
      example:
        avsendersMeldingsidentifikator: MSG-2026-ENDRE-0001
        avsendersSaksreferanse: SAK-2026-ENDRE-0001
        kildesystem: Visma Flyt Barnevern
        avsendersInnsendingstidspunkt: '2026-09-07T11:30:00+02:00'
        gyldighetsdato: '2026-09-01'
        innsender:
          - navnPaaBarnevernstjenesten: Oslo barnevernstjeneste
            barnevernstjeneste: '123456789'
        barn:
          foedselsEllerDNummer: '01010112345'
        forelder:
          foedselsEllerDNummer: '02020223456'
        barnevernstjeneste:
          ansvarligBarnevernstjeneste: '111222333'
        vedlegg:
          - filnavn: vedtak.pdf
            innholdstype: application/pdf
            innholdBase64: UERG
    KorrigereRequest:
      $ref: '#/components/schemas/OmsorgsansvarEndringRequest'
    OpphoereRequest:
      $ref: '#/components/schemas/OmsorgsansvarEndringRequest'
    AnnullereRequest:
      $ref: '#/components/schemas/OmsorgsansvarEndringRequest'
    OverfoereRequest:
      $ref: '#/components/schemas/OmsorgsansvarEndringRequest'
    OmsorgsansvarEndringRequest:
      type: object
      description: >-
        Offentlig requestmodell. Folgende felter fra Skatteetatens
        backend-melding (XSD) eksponeres ikke i API-et, men settes internt ved
        videreformidling:

        - `forespoerseltype`: utledes av valgt endepunkt:
          `/omsorgsansvar/endre` -> `endre`, `/omsorgsansvar/korrigere` ->
          `korrigere`, `/omsorgsansvar/opphoere` -> `opphoere`,
          `/omsorgsansvar/annullere` -> `annullere`,
          `/omsorgsansvar/overfoere` -> `overfoere`.
        - `innsender[].innsendertype`: settes til `barnevernstjenesten`.
        - `mottak.informasjonskanal`: settes til `elektroniskMelding`.
        - `mottak.mottakstidspunktFraOpprinneligKanal`: settes internt til
          `Date.now()` av mottakslosningen.
      required:
        - avsendersMeldingsidentifikator
        - avsendersSaksreferanse
        - kildesystem
        - avsendersInnsendingstidspunkt
        - gyldighetsdato
        - innsender
        - barn
        - forelder
        - barnevernstjeneste
      properties:
        avsendersMeldingsidentifikator:
          type: string
          maxLength: 4000
          description: >-
            Klientens unike meldingsid. Brukes som idempotensnokkel (unik per
            klient/tenant).
        avsendersSaksreferanse:
          type: string
          maxLength: 4000
          description: >-
            Klientens interne saksreferanse. Obligatorisk og returneres i
            tilbakemeldinger.
        kildesystem:
          type: string
          maxLength: 4000
          description: Navn pa avgivende kildesystem.
        avsendersInnsendingstidspunkt:
          type: string
          format: date-time
          description: Tidspunkt da meldingen ble sendt fra klienten.
        gyldighetsdato:
          type: string
          format: date
          description: >-
            Operasjonsspesifikk dato: gyldig fra, opphor, eller
            overforingstidspunkt avhengig av endepunkt.
        innsender:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Innsender'
          description: En eller flere innsendere.
        barn:
          $ref: '#/components/schemas/Personidentifikator'
        forelder:
          $ref: '#/components/schemas/Personidentifikator'
        barnevernstjeneste:
          $ref: '#/components/schemas/Barnevernstjeneste'
        vedlegg:
          type: array
          description: Valgfrie vedlegg kodet i base64.
          items:
            $ref: '#/components/schemas/Vedlegg'
    Innsender:
      type: object
      required:
        - navnPaaBarnevernstjenesten
        - barnevernstjeneste
      properties:
        navnPaaBarnevernstjenesten:
          type: string
          maxLength: 175
        barnevernstjeneste:
          type: string
          pattern: ^[0-9]{9}$
    Personidentifikator:
      type: object
      required:
        - foedselsEllerDNummer
      properties:
        foedselsEllerDNummer:
          type: string
          pattern: ^[0-9]{11}$
          description: Fodselsnummer eller D-nummer (11 siffer).
    Barnevernstjeneste:
      type: object
      required:
        - ansvarligBarnevernstjeneste
      properties:
        ansvarligBarnevernstjeneste:
          type: string
          pattern: ^[0-9]{9}$
    Vedlegg:
      type: object
      required:
        - filnavn
        - innholdstype
        - innholdBase64
      properties:
        filnavn:
          type: string
          maxLength: 255
        innholdstype:
          type: string
          enum:
            - application/pdf
            - image/png
            - image/jpeg
        innholdBase64:
          type: string
          format: byte
          description: Filinnhold kodet i base64.
    InnsendingKvittering:
      type: object
      required:
        - sakId
        - saksnummer
        - avsendersMeldingsidentifikator
        - status
        - mottattTidspunkt
      properties:
        sakId:
          type: string
          format: uuid
        saksnummer:
          type: string
        folkeregisterReferanse:
          type: string
          format: uuid
          description: Referanse returnert fra Folkeregisterets mottak ved akseptert innsending.
        avsendersMeldingsidentifikator:
          type: string
        status:
          type: string
          enum:
            - MOTTATT
            - UNDER_BEHANDLING
            - FERDIGBEHANDLET
            - AVVIST
            - TRENGER_MANUELL_BEHANDLING
        mottattTidspunkt:
          type: string
          format: date-time
      example:
        sakId: 2d7f86de-4d3c-4e93-a9fc-3f65a54f5c4a
        saksnummer: '2026-000123'
        folkeregisterReferanse: 47956f5b-fa1e-447d-a62d-b6714bc1f120
        avsendersMeldingsidentifikator: MSG-2026-ENDRE-0001
        status: MOTTATT
        mottattTidspunkt: '2026-09-09T09:12:31Z'
    TilbakemeldingStart:
      type: object
      required:
        - sekvensnummer
      properties:
        sekvensnummer:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Startsekvens for klienten. Sekvensnummer kan inneholde hull fordi
            sekvensen gjenbrukes fra Skatt.
    TilbakemeldingSide:
      type: object
      required:
        - fraSekvensnummer
        - nesteSekvensnummer
        - tilbakemeldinger
      properties:
        fraSekvensnummer:
          type: integer
          format: int64
        nesteSekvensnummer:
          type: integer
          format: int64
          description: >-
            Bruk denne verdien som `fraSekvensnummer` i neste poll-kall.
            Sekvensnummer kan inneholde hull fordi sekvensen gjenbrukes fra
            Skatt.
        tilbakemeldinger:
          type: array
          items:
            $ref: '#/components/schemas/TilbakemeldingHendelse'
    TilbakemeldingHendelse:
      type: object
      required:
        - sekvensnummer
        - sakId
        - saksnummer
        - avsendersMeldingsidentifikator
        - status
        - oppdatertTidspunkt
      properties:
        sekvensnummer:
          type: integer
          format: int64
          description: >-
            Sekvensnummer for hendelsen. Sekvensnummer kan inneholde hull fordi
            sekvensen gjenbrukes fra Skatt.
        sakId:
          type: string
          format: uuid
        saksnummer:
          type: string
        folkeregisterReferanse:
          type: string
          format: uuid
          description: Referanse fra Folkeregisteret for opprinnelig innsending.
        avsendersMeldingsidentifikator:
          type: string
        avsendersSaksreferanse:
          type: string
        status:
          type: string
          enum:
            - MOTTATT
            - UNDER_BEHANDLING
            - FERDIGBEHANDLET
            - AVVIST
            - TRENGER_MANUELL_BEHANDLING
        resultatkode:
          type: string
          description: Maskinlesbar kode fra backend/Folkeregisteret.
        resultatbeskrivelse:
          type: string
          description: Lesbar beskrivelse av resultat.
        oppdatertTidspunkt:
          type: string
          format: date-time
      example:
        sekvensnummer: 182734
        sakId: 2d7f86de-4d3c-4e93-a9fc-3f65a54f5c4a
        saksnummer: '2026-000123'
        folkeregisterReferanse: 47956f5b-fa1e-447d-a62d-b6714bc1f120
        avsendersMeldingsidentifikator: MSG-2026-ENDRE-0001
        avsendersSaksreferanse: SAK-2026-ENDRE-0001
        status: FERDIGBEHANDLET
        resultatkode: FREG-OK
        resultatbeskrivelse: Meldingen er ferdig behandlet.
        oppdatertTidspunkt: '2026-09-09T09:13:05Z'
    SakStatus:
      type: object
      required:
        - sakId
        - saksnummer
        - avsendersMeldingsidentifikator
        - status
        - oppdatertTidspunkt
      properties:
        sakId:
          type: string
          format: uuid
        saksnummer:
          type: string
        avsendersMeldingsidentifikator:
          type: string
        status:
          type: string
          enum:
            - MOTTATT
            - UNDER_BEHANDLING
            - FERDIGBEHANDLET
            - AVVIST
            - TRENGER_MANUELL_BEHANDLING
        oppdatertTidspunkt:
          type: string
          format: date-time
    IdempotensKonflikt:
      type: object
      description: Returneres nar samme `avsendersMeldingsidentifikator` allerede er brukt av klienten.
      required:
        - kode
        - melding
        - avsendersMeldingsidentifikator
      properties:
        kode:
          type: string
          example: idempotent_konflikt
        melding:
          type: string
          example: avsendersMeldingsidentifikator finnes allerede for denne klienten.
        avsendersMeldingsidentifikator:
          type: string
        sakId:
          type: string
          format: uuid
          description: Intern teknisk identifikator for eksisterende sak nar kjent.
        saksnummer:
